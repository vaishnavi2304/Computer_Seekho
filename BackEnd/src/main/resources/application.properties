# =========================================================
# CLEAN FILE LOGGING
# =========================================================

# Default: only warnings and errors from frameworks
logging.level.root=WARN

# Keep our own project logs visible
logging.level.com.example.aspects=INFO
logging.level.com.example.services=INFO
logging.level.com.example.controllers=INFO
logging.level.com.example.demo.BackendApplication=INFO

# Reduce unnecessary framework logs
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN

# Save logs in file
logging.file.name=logs/computer-seekho.log

# Clean readable file format
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{35} - %msg%n

# Disable large DevTools condition report
spring.devtools.restart.log-condition-evaluation-delta=false

# Disable extra DevTools logging properties
spring.devtools.add-properties=false
spring.jpa.open-in-view=false

# =========================================================
# ACTUATOR
# =========================================================

# Expose selected actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,loggers

# Show health details to authorized users
management.endpoint.health.show-details=when-authorized

# Allow info.* properties to appear
management.info.env.enabled=true

